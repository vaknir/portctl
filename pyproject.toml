[project]
name = "portctl"
version = "0.1.0"
description = "GitOps CLI for Port.io — kubectl for your developer portal"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "deepdiff>=7.0",
    "keyring>=25.0.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "vcrpy>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
portctl = "portctl.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests requiring real Port.io API credentials"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
strict = true
python_version = "3.11"


