identifier: serviceEntity
title: Service
type: entity
icon: Microservice
widgets:
- id: awJchaDRZdcN8sBa
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: eEor4zSLJStcwTlb
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: cdi2gq5exfztLMNb
          size: 12
      widgets:
      - id: cdi2gq5exfztLMNb
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: rPvuMI0lDSAGoogl
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: Nvh6QEuwGOyUifwu
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: GZO75FRGNMYeobaJ
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: bUPy5qryGifTIfYT
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: 4rMtOmQYphewUJdx
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
