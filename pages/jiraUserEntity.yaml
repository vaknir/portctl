identifier: jiraUserEntity
title: Jira User
type: entity
icon: Jira
widgets:
- id: HtboHmWQTmQN21Av
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: zE8NIaV0NwtyseWi
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: LQ2RZLWIFWZZt7Ya
          size: 12
      widgets:
      - id: LQ2RZLWIFWZZt7Ya
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: s50Se0Na8MPxSS9V
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: Vtd9FAmohvJzJH9c
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: bP19jEi1kQErosV6
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: Z74HHGbqYBjahZBm
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: lgF8Pd9NU0W8F2gu
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
