identifier: jiraIssueEntity
title: Jira Issue
type: entity
icon: Jira
widgets:
- id: zWg1mbrA2ihUGM5x
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: es7eiHxz4b1AN4eC
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: sSOLxTCTyb8mzLjv
          size: 12
      widgets:
      - id: sSOLxTCTyb8mzLjv
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: s7jlnMxkEou6FMGl
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: IU0nxDPh8n4Wt6Zl
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: oUYGn4txHLvVmp0J
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: 0MQIlfuZujpHsQio
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: wgWwUmeuMRQ0u77h
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
