identifier: teamEntity
title: Team
type: entity
icon: Team
widgets:
- id: BZTPQnUEt2NRkAQp
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: Aup7kAsbPQ0dbqRZ
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: xfjQMYDcotNNulbw
          size: 12
      widgets:
      - id: xfjQMYDcotNNulbw
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: VD0jjmszO7TDfe0A
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: VPwF1oohQENiGQTe
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: nMikOl1Y6SPQjctd
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: Z20yHlmCrcrQqeyA
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: dhBHShvkSQEWNYHm
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
