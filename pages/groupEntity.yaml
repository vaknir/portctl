identifier: groupEntity
title: Group
type: entity
icon: Home
widgets:
- id: f3f8u7CICin3vNFB
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: TVIgeVH6Ss5h6dT2
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: J3v6isyprbIpFeQ3
          size: 12
      widgets:
      - id: J3v6isyprbIpFeQ3
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: xMez0JbsxwpEp8wF
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: syQtssxJpAmykPr6
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: rqaWEYnyd7flsnE9
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: IPc7OcmHrt72aoyy
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: qWuCEyZaQFIQ9t4H
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
