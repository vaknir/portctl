identifier: githubOrganizationEntity
title: Organization
type: entity
icon: Github
widgets:
- id: 25QqUQ14H9HkIb6o
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: 8QgZWivDLEUNd6cC
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: yGrYg1vlSQQ2PrtH
          size: 12
      widgets:
      - id: yGrYg1vlSQQ2PrtH
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: sobJo59iAHPysWpR
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: VSvh9QAiQrHQ1Sws
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: O7SYmkOnqEWu0Fz3
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: UlgzGdvEoqDQxDlj
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: WeQdSMl63aF8GujJ
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
