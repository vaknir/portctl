identifier: jiraProjectEntity
title: Jira Project
type: entity
icon: Jira
widgets:
- id: pIUxhEEt5YHuS2Co
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: aQQvwuEinQtfeR3k
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: q7FcFjQvNudubtYB
          size: 12
      widgets:
      - id: q7FcFjQvNudubtYB
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: guwgBPOWLbv28AmU
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: yF4GmQ3aebFo7hpj
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: W8kCLMNs0xmov744
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: v4xZBkaakt9iksEx
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: 1wfctvfzsxsNV76l
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
