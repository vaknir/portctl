identifier: githubUserEntity
title: Github User
type: entity
icon: Github
widgets:
- id: xinQVIsVLDnMQmfq
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: t13CfI8LO4rD8gQl
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: bGx77go1zDZwDTIN
          size: 12
      widgets:
      - id: bGx77go1zDZwDTIN
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: 7e3CEPGpOpiJQAN4
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: DhspaQ5mekMOY3sy
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: v9Bbn1fc5geR0a6J
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: QcAIgHO3L2SiLesT
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: w2eryVTzQ3d42rWt
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
