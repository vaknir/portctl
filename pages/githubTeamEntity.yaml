identifier: githubTeamEntity
title: GitHub Team
type: entity
icon: Github
widgets:
- id: jzQ9Aus7VEwwb7Is
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: ZrbJfErqFOWazzeu
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: YxRQQSYr0SSSziTa
          size: 12
      widgets:
      - id: YxRQQSYr0SSSziTa
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: qyaQO8Wk4D9YfpWl
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: Y72T2oU7x0kewZcH
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: ucrFeU10xx789LcV
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: YQ1nGxdtzQQf6CmY
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: E0iuQcPrVCt9OQ0R
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
