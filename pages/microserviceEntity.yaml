identifier: microserviceEntity
title: Microservice
type: entity
icon: Microservice
widgets:
- id: reGoc5ZqiBwi0qqQ
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: liqYCQZixnInLg4r
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: 6kG6QOW7LyPYRjZV
          size: 12
      widgets:
      - id: 6kG6QOW7LyPYRjZV
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: n0LyyEnQQtQfUuWa
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: eaah7GNqjfi2VQqT
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: FaEJ7W4Lc0QYRHOG
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: JisS0SUWwTwY15iq
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: xspU6t78G3xDPWMa
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
