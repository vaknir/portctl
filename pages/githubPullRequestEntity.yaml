identifier: githubPullRequestEntity
title: Pull Request
type: entity
icon: Github
widgets:
- id: CpQOontY3g4lZ0jL
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: axDnBSJthn2DV8we
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: g3rJgsSFNiSPQiSt
          size: 12
      widgets:
      - id: g3rJgsSFNiSPQiSt
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: lg7Stb5Lp2Oi87p3
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: MVbTUg2egC8HGRwI
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: b8eloqVtQIfozRki
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: QI67LfLqTV1HBEgJ
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: zDQUpPtxdReiqhPv
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
