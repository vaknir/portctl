identifier: workloadEntity
title: Workload
type: entity
icon: Deployment
widgets:
- id: 6ACQpuZ6AoyOPalM
  type: grouper
  displayMode: tabs
  activeGroupUrlParam: activeTab
  groupsOrder:
  - Overview
  - Related Entities
  - Runs
  - Audit Log
  - Scorecards
  - Dashboard
  groups:
  - title: Overview
    widgets:
    - id: smgFgG06QHllvEDF
      type: dashboard-widget
      layout:
      - height: 400
        columns:
        - id: 8BLw6ZMHVjWABfnf
          size: 12
      widgets:
      - id: 8BLw6ZMHVjWABfnf
        type: entity-info
        title: Details
        blueprint: '{{blueprint}}'
        entity: '{{url.identifier}}'
  - title: Related Entities
    widgets:
    - id: ozsarxERYFskAxlL
      type: grouper
      title: Related Entities
      displayMode: switch
      groups:
      - title: Table
        icon: Table
        widgets:
        - id: Mi9ph630DdgtrzAM
          type: table-entities-explorer-by-direction
      - title: Graph
        icon: Relation
        widgets:
        - id: dILqdLMiU1ZAR1iU
          type: graph-entities-explorer
          hiddenBlueprints: []
          dataset:
            combinator: or
            rules:
            - operator: relatedTo
              value: '{{url.identifier}}'
              blueprint: '{{blueprint}}'
            - combinator: and
              rules:
              - operator: '='
                value: '{{url.identifier}}'
                property: $identifier
              - operator: '='
                value: '{{blueprint}}'
                property: $blueprint
  - title: Runs
    widgets:
    - title: Run Log
      id: AV5G97uifBSWPlhs
      type: runs-table
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
  - title: Audit Log
    widgets:
    - id: yzcZ0lbF1QGp1StQ
      type: table-audit-log
      query:
        entity: '{{url.identifier}}'
        blueprint: '{{blueprint}}'
locked: false
